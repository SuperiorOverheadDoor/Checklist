<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Garage Door Inspection Report</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: linear-gradient(160deg, #f0f4f8 0%, #e8edf5 100%); min-height: 100vh; }
    input, select, textarea { font-family: 'Source Sans 3', sans-serif !important; }
    @media print { button { display: none !important; } body { background: white; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const TECHNICIANS = ["Select Technician", "Ken", "Shane", "Jake", "Craig"];

    const CHECKLIST_ITEMS = [
      { id: "springs", label: "Torsion / Extension Springs", category: "Mechanical" },
      { id: "cables", label: "Lift Cables", category: "Mechanical" },
      { id: "rollers", label: "Rollers & Hinges", category: "Mechanical" },
      { id: "tracks", label: "Tracks & Alignment", category: "Mechanical" },
      { id: "opener_motor", label: "Opener Motor", category: "Opener" },
      { id: "opener_drive", label: "Drive System (Belt/Chain/Screw)", category: "Opener" },
      { id: "safety_reverse", label: "Auto-Reverse Safety Test", category: "Safety" },
      { id: "photo_eyes", label: "Photo Eye Sensors", category: "Safety" },
      { id: "weatherstrip", label: "Weatherstripping & Seals", category: "Exterior" },
      { id: "panels", label: "Door Panels & Condition", category: "Exterior" },
      { id: "balance", label: "Door Balance Test", category: "Performance" },
      { id: "lubrication", label: "Lubrication & Noise", category: "Performance" },
    ];

    const STATUS = {
      green: { label: "Pass", bg: "#16a34a", light: "#dcfce7", border: "#86efac", text: "#15803d", icon: "✓" },
      yellow: { label: "Monitor", bg: "#ca8a04", light: "#fef9c3", border: "#fde047", text: "#a16207", icon: "⚠" },
      red: { label: "Fix", bg: "#dc2626", light: "#fee2e2", border: "#fca5a5", text: "#b91c1c", icon: "✕" },
      none: { label: "Not Checked", bg: "#e2e8f0", light: "#f8fafc", border: "#cbd5e1", text: "#64748b", icon: "–" },
    };

    function StatusButton({ value, current, onChange }) {
      const s = STATUS[value];
      const active = current === value;
      return (
        <button
          onClick={() => onChange(value)}
          style={{
            padding: "5px 12px", borderRadius: "6px",
            border: `2px solid ${active ? s.bg : "#e2e8f0"}`,
            background: active ? s.bg : "#f8fafc",
            color: active ? "white" : "#94a3b8",
            fontWeight: active ? "700" : "500",
            fontSize: "12px", cursor: "pointer", transition: "all 0.15s",
            display: "flex", alignItems: "center", gap: "4px",
            fontFamily: "inherit", letterSpacing: "0.02em",
          }}
        >
          <span>{s.icon}</span> {s.label}
        </button>
      );
    }

    function DoorReport({ report, index, onUpdate, onRemove, totalReports }) {
      const grouped = CHECKLIST_ITEMS.reduce((acc, item) => {
        if (!acc[item.category]) acc[item.category] = [];
        acc[item.category].push(item);
        return acc;
      }, {});

      const updateStatus = (id, status) => onUpdate({ ...report, statuses: { ...report.statuses, [id]: status } });
      const updateNote = (id, note) => onUpdate({ ...report, notes: { ...report.notes, [id]: note } });

      const getScore = () => {
        const vals = Object.values(report.statuses);
        return {
          green: vals.filter(v => v === "green").length,
          yellow: vals.filter(v => v === "yellow").length,
          red: vals.filter(v => v === "red").length,
          total: CHECKLIST_ITEMS.length,
          checked: vals.length,
        };
      };
      const score = getScore();

      const getGrade = () => {
        if (score.red > 0) return { letter: "NEEDS REPAIR", color: "#dc2626", bg: "#fee2e2" };
        if (score.yellow >= 3) return { letter: "FAIR", color: "#ca8a04", bg: "#fef9c3" };
        if (score.yellow > 0) return { letter: "GOOD", color: "#ca8a04", bg: "#fef9c3" };
        if (score.checked === score.total) return { letter: "EXCELLENT", color: "#16a34a", bg: "#dcfce7" };
        return { letter: "IN PROGRESS", color: "#6366f1", bg: "#eef2ff" };
      };
      const grade = getGrade();

      return (
        <div style={{ background: "white", borderRadius: "16px", boxShadow: "0 4px 24px rgba(0,0,0,0.08)", overflow: "hidden", marginBottom: "32px", border: "1px solid #f1f5f9" }}>
          {/* Door Header */}
          <div style={{ background: "linear-gradient(135deg, #1e293b 0%, #334155 100%)", padding: "20px 28px", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: "12px" }}>
            <div style={{ display: "flex", alignItems: "center", gap: "14px" }}>
              <div style={{ width: "44px", height: "44px", background: "rgba(255,255,255,0.12)", borderRadius: "12px", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "22px" }}>🚪</div>
              <div>
                <input value={report.doorName} onChange={e => onUpdate({ ...report, doorName: e.target.value })} placeholder="Door Name / Location"
                  style={{ background: "transparent", border: "none", color: "white", fontSize: "18px", fontWeight: "700", fontFamily: "inherit", outline: "none", width: "220px", letterSpacing: "0.01em" }} />
                <div style={{ color: "#94a3b8", fontSize: "12px", marginTop: "2px" }}>Door #{index + 1} of {totalReports}</div>
              </div>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: "12px" }}>
              <div style={{ padding: "8px 18px", borderRadius: "10px", background: grade.bg, color: grade.color, fontWeight: "800", fontSize: "13px", letterSpacing: "0.06em" }}>{grade.letter}</div>
              <div style={{ display: "flex", gap: "6px", fontSize: "12px" }}>
                <span style={{ background: "#dcfce7", color: "#16a34a", padding: "4px 8px", borderRadius: "6px", fontWeight: "700" }}>{score.green} ✓</span>
                <span style={{ background: "#fef9c3", color: "#ca8a04", padding: "4px 8px", borderRadius: "6px", fontWeight: "700" }}>{score.yellow} ⚠</span>
                <span style={{ background: "#fee2e2", color: "#dc2626", padding: "4px 8px", borderRadius: "6px", fontWeight: "700" }}>{score.red} ✕</span>
              </div>
              {totalReports > 1 && (
                <button onClick={onRemove} style={{ background: "rgba(255,255,255,0.1)", border: "none", color: "#94a3b8", borderRadius: "8px", width: "32px", height: "32px", cursor: "pointer", fontSize: "16px", display: "flex", alignItems: "center", justifyContent: "center" }}>×</button>
              )}
            </div>
          </div>

          {/* Door Details */}
          <div style={{ background: "#f8fafc", padding: "14px 28px", borderBottom: "1px solid #e2e8f0", display: "flex", gap: "20px", flexWrap: "wrap", alignItems: "center" }}>
            {[
              { label: "Door Type", content: <select value={report.doorType} onChange={e => onUpdate({ ...report, doorType: e.target.value })} style={{ display: "block", marginTop: "4px", padding: "6px 10px", borderRadius: "8px", border: "1px solid #e2e8f0", fontFamily: "inherit", fontSize: "13px", background: "white", color: "#1e293b" }}><option>Residential</option><option>Commercial</option><option>Industrial</option><option>Fire-Rated</option></select> },
              { label: "Material", content: <select value={report.material} onChange={e => onUpdate({ ...report, material: e.target.value })} style={{ display: "block", marginTop: "4px", padding: "6px 10px", borderRadius: "8px", border: "1px solid #e2e8f0", fontFamily: "inherit", fontSize: "13px", background: "white", color: "#1e293b" }}><option>Steel</option><option>Aluminum</option><option>Wood</option><option>Fiberglass</option><option>Vinyl</option></select> },
              { label: "Opener Brand", content: <input value={report.openerBrand} onChange={e => onUpdate({ ...report, openerBrand: e.target.value })} placeholder="e.g. LiftMaster" style={{ display: "block", marginTop: "4px", padding: "6px 10px", borderRadius: "8px", border: "1px solid #e2e8f0", fontFamily: "inherit", fontSize: "13px", width: "130px", color: "#1e293b" }} /> },
              { label: "Age (Years)", content: <input value={report.age} onChange={e => onUpdate({ ...report, age: e.target.value })} placeholder="e.g. 5" style={{ display: "block", marginTop: "4px", padding: "6px 10px", borderRadius: "8px", border: "1px solid #e2e8f0", fontFamily: "inherit", fontSize: "13px", width: "80px", color: "#1e293b" }} /> },
            ].map(({ label, content }) => (
              <div key={label}>
                <label style={{ fontSize: "11px", fontWeight: "700", color: "#64748b", letterSpacing: "0.08em", textTransform: "uppercase" }}>{label}</label>
                {content}
              </div>
            ))}
          </div>

          {/* Checklist */}
          <div style={{ padding: "24px 28px" }}>
            {Object.entries(grouped).map(([cat, items]) => (
              <div key={cat} style={{ marginBottom: "24px" }}>
                <div style={{ fontSize: "11px", fontWeight: "800", color: "#94a3b8", letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: "10px", display: "flex", alignItems: "center", gap: "8px" }}>
                  <div style={{ height: "1px", width: "16px", background: "#e2e8f0" }} />{cat}<div style={{ flex: 1, height: "1px", background: "#e2e8f0" }} />
                </div>
                {items.map(item => {
                  const status = report.statuses[item.id] || "none";
                  const s = STATUS[status];
                  return (
                    <div key={item.id} style={{ display: "flex", alignItems: "flex-start", gap: "14px", padding: "10px 14px", borderRadius: "10px", background: status !== "none" ? s.light : "transparent", border: `1px solid ${status !== "none" ? s.border : "transparent"}`, marginBottom: "6px", transition: "all 0.2s" }}>
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ fontWeight: "600", color: "#1e293b", fontSize: "14px", marginBottom: "6px" }}>{item.label}</div>
                        <div style={{ display: "flex", gap: "6px", flexWrap: "wrap" }}>
                          {["green", "yellow", "red"].map(v => <StatusButton key={v} value={v} current={status} onChange={val => updateStatus(item.id, val)} />)}
                        </div>
                      </div>
                      <div style={{ minWidth: "200px" }}>
                        <input value={report.notes[item.id] || ""} onChange={e => updateNote(item.id, e.target.value)} placeholder="Add note..."
                          style={{ width: "100%", padding: "7px 10px", borderRadius: "8px", border: "1px solid #e2e8f0", fontFamily: "inherit", fontSize: "12px", color: "#475569", background: "white", outline: "none", boxSizing: "border-box" }} />
                      </div>
                    </div>
                  );
                })}
              </div>
            ))}
            <div style={{ marginTop: "8px" }}>
              <label style={{ fontSize: "11px", fontWeight: "700", color: "#64748b", letterSpacing: "0.08em", textTransform: "uppercase" }}>Overall Recommendations</label>
              <textarea value={report.overallNotes} onChange={e => onUpdate({ ...report, overallNotes: e.target.value })} placeholder="Enter any overall recommendations or notes for this door..." rows={3}
                style={{ display: "block", width: "100%", marginTop: "8px", padding: "10px 14px", borderRadius: "10px", border: "1px solid #e2e8f0", fontFamily: "inherit", fontSize: "13px", color: "#475569", resize: "vertical", boxSizing: "border-box", lineHeight: "1.5" }} />
            </div>
          </div>
        </div>
      );
    }

    const newReport = (n) => ({
      id: Date.now() + n, doorName: `Door ${n + 1}`, doorType: "Residential",
      material: "Steel", openerBrand: "", age: "", statuses: {}, notes: {}, overallNotes: "",
    });

    function App() {
      const today = new Date().toISOString().split("T")[0];
      const [tech, setTech] = useState("Select Technician");
      const [date, setDate] = useState(today);
      const [customer, setCustomer] = useState("");
      const [address, setAddress] = useState("");
      const [reports, setReports] = useState([newReport(0)]);

      const addDoor = () => setReports(r => [...r, newReport(r.length)]);
      const updateReport = (id, updated) => setReports(r => r.map(x => x.id === id ? updated : x));
      const removeReport = (id) => setReports(r => r.filter(x => x.id !== id));

      const totalGreen = reports.reduce((a, r) => a + Object.values(r.statuses).filter(v => v === "green").length, 0);
      const totalYellow = reports.reduce((a, r) => a + Object.values(r.statuses).filter(v => v === "yellow").length, 0);
      const totalRed = reports.reduce((a, r) => a + Object.values(r.statuses).filter(v => v === "red").length, 0);

      const handleSave = () => {
        const statusLabel = { green: "PASS", yellow: "MONITOR", red: "FIX", none: "—" };
        const statusColor = { green: "#16a34a", yellow: "#b45309", red: "#dc2626", none: "#94a3b8" };
        const statusBg   = { green: "#dcfce7", yellow: "#fef9c3", red: "#fee2e2", none: "#f8fafc" };

        const totalGreenCount = reports.reduce((a,r)=>a+Object.values(r.statuses).filter(v=>v==="green").length,0);
        const totalYellowCount = reports.reduce((a,r)=>a+Object.values(r.statuses).filter(v=>v==="yellow").length,0);
        const totalRedCount = reports.reduce((a,r)=>a+Object.values(r.statuses).filter(v=>v==="red").length,0);

        const doorsHTML = reports.map(r => {
          const rows = CHECKLIST_ITEMS.map(item => {
            const s = r.statuses[item.id] || "none";
            const note = r.notes[item.id] || "";
            return `<tr>
              <td style="padding:5px 8px;border-bottom:1px solid #f1f5f9;font-size:12px;width:38%;">${item.label}</td>
              <td style="padding:5px 8px;border-bottom:1px solid #f1f5f9;width:15%;">
                <span style="display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;background:${statusBg[s]};color:${statusColor[s]}">${statusLabel[s]}</span>
              </td>
              <td style="padding:5px 8px;border-bottom:1px solid #f1f5f9;font-size:11px;color:#475569;">${note}</td>
            </tr>`;
          }).join("");

          const dProps = [
            r.doorType, r.material,
            r.openerBrand ? "Opener: "+r.openerBrand : null,
            r.age ? "Age: "+r.age+" yrs" : null
          ].filter(Boolean).join(" &nbsp;|&nbsp; ");

          return `<div style="margin-bottom:14px;border:1px solid #cbd5e1;border-radius:8px;overflow:hidden;page-break-inside:avoid;">
            <div style="background:#1e293b;color:white;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;">
              <span style="font-size:13px;font-weight:700;">${r.doorName}</span>
              <span style="font-size:11px;color:#94a3b8;">${dProps}</span>
            </div>
            <table style="width:100%;border-collapse:collapse;font-family:sans-serif;">
              <thead><tr style="background:#f8fafc;">
                <th style="padding:5px 8px;text-align:left;font-size:10px;color:#64748b;font-weight:700;letter-spacing:.06em;width:38%;">INSPECTION ITEM</th>
                <th style="padding:5px 8px;text-align:left;font-size:10px;color:#64748b;font-weight:700;letter-spacing:.06em;width:15%;">STATUS</th>
                <th style="padding:5px 8px;text-align:left;font-size:10px;color:#64748b;font-weight:700;letter-spacing:.06em;">NOTES</th>
              </tr></thead>
              <tbody>${rows}</tbody>
            </table>
            ${r.overallNotes ? `<div style="padding:6px 14px;background:#fffbeb;font-size:11px;color:#92400e;border-top:1px solid #fde68a;"><strong>Recommendations:</strong> ${r.overallNotes}</div>` : ""}
          </div>`;
        }).join("");

        const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Inspection Report</title>
          <style>
            * { box-sizing: border-box; margin: 0; padding: 0; }
            body { font-family: Arial, sans-serif; font-size: 13px; color: #1e293b; background: white; }
            .page { max-width: 780px; margin: 0 auto; padding: 24px; }
            @media print {
              body { padding: 0; }
              .no-print { display: none !important; }
              .page { padding: 12px; max-width: 100%; }
              @page { margin: 0.5in; size: letter; }
            }
          </style>
        </head><body><div class="page">

          <!-- Header -->
          <div style="display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:12px;border-bottom:3px solid #0f172a;margin-bottom:12px;">

                  </div>
                  <div style={{ color: "#94a3b8", fontSize: "13px", lineHeight: "1.8" }}>
                    <div>Address: 19 Grove St, Berkley, MA</div>
                    <div>Phone: 508-821-7878</div>
                    <div>Email: Mysuperiordoor@comcast.net</div>
                  </div>
                </div>
                <div style={{ textAlign: "right" }}>
                  <div style={{ fontFamily: "'Oswald', sans-serif", fontSize: "28px", fontWeight: "700", color: "white", letterSpacing: "0.06em", textTransform: "uppercase" }}>Inspection Report</div>
                  <div style={{ display: "inline-block", marginTop: "6px", padding: "4px 14px", background: "#f59e0b", borderRadius: "6px", color: "#0f172a", fontWeight: "700", fontSize: "12px", letterSpacing: "0.1em" }}>GARAGE DOOR ASSESSMENT</div>
                  <div style={{ marginTop: "16px", display: "flex", gap: "12px", justifyContent: "flex-end", flexWrap: "wrap" }}>
                    <div style={{ background: "#22c55e", padding: "6px 14px", borderRadius: "8px", color: "white", fontWeight: "700", fontSize: "12px" }}>● PASS</div>
                    <div style={{ background: "#eab308", padding: "6px 14px", borderRadius: "8px", color: "white", fontWeight: "700", fontSize: "12px" }}>● MONITOR</div>
                    <div style={{ background: "#ef4444", padding: "6px 14px", borderRadius: "8px", color: "white", fontWeight: "700", fontSize: "12px" }}>● FIX</div>
                  </div>
                </div>
              </div>
            </div>

            {/* Job Info */}
            <div style={{ background: "white", borderRadius: "16px", padding: "24px 28px", marginBottom: "24px", boxShadow: "0 2px 12px rgba(0,0,0,0.06)", border: "1px solid #f1f5f9" }}>
              <div style={{ fontFamily: "'Oswald', sans-serif", fontSize: "14px", letterSpacing: "0.1em", color: "#64748b", marginBottom: "16px" }}>JOB INFORMATION</div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(180px, 1fr))", gap: "16px" }}>
                {[
                  { label: "Technician", content: <select value={tech} onChange={e => setTech(e.target.value)} style={{ width: "100%", padding: "8px 10px", borderRadius: "8px", border: "1px solid #e2e8f0", fontSize: "14px", color: "#1e293b", background: "white" }}>{TECHNICIANS.map(t => <option key={t}>{t}</option>)}</select> },
                  { label: "Inspection Date", content: <input type="date" value={date} onChange={e => setDate(e.target.value)} style={{ width: "100%", padding: "8px 10px", borderRadius: "8px", border: "1px solid #e2e8f0", fontSize: "14px", color: "#1e293b" }} /> },
                  { label: "Customer Name", content: <input value={customer} onChange={e => setCustomer(e.target.value)} placeholder="Customer name" style={{ width: "100%", padding: "8px 10px", borderRadius: "8px", border: "1px solid #e2e8f0", fontSize: "14px", color: "#1e293b" }} /> },
                  { label: "Service Address", content: <input value={address} onChange={e => setAddress(e.target.value)} placeholder="Job address" style={{ width: "100%", padding: "8px 10px", borderRadius: "8px", border: "1px solid #e2e8f0", fontSize: "14px", color: "#1e293b" }} /> },
                ].map(({ label, content }) => (
                  <div key={label}>
                    <div style={{ fontSize: "11px", fontWeight: "700", color: "#64748b", letterSpacing: "0.08em", textTransform: "uppercase", marginBottom: "6px" }}>{label}</div>
                    {content}
                  </div>
                ))}
              </div>
            </div>

            {/* Summary Bar */}
            {(totalGreen + totalYellow + totalRed) > 0 && (
              <div style={{ background: "white", borderRadius: "12px", padding: "16px 24px", marginBottom: "24px", display: "flex", gap: "20px", flexWrap: "wrap", alignItems: "center", boxShadow: "0 2px 12px rgba(0,0,0,0.06)", border: "1px solid #f1f5f9" }}>
                <div style={{ fontFamily: "'Oswald', sans-serif", fontSize: "13px", letterSpacing: "0.08em", color: "#64748b" }}>OVERALL SUMMARY</div>
                <div style={{ display: "flex", gap: "12px" }}>
                  <span style={{ background: "#dcfce7", color: "#16a34a", padding: "6px 16px", borderRadius: "8px", fontWeight: "700", fontSize: "14px" }}>✓ {totalGreen} Pass</span>
                  <span style={{ background: "#fef9c3", color: "#ca8a04", padding: "6px 16px", borderRadius: "8px", fontWeight: "700", fontSize: "14px" }}>⚠ {totalYellow} Monitor</span>
                  <span style={{ background: "#fee2e2", color: "#dc2626", padding: "6px 16px", borderRadius: "8px", fontWeight: "700", fontSize: "14px" }}>✕ {totalRed} Fix</span>
                </div>
                <div style={{ marginLeft: "auto", fontSize: "13px", color: "#64748b" }}>{reports.length} door{reports.length !== 1 ? "s" : ""} inspected</div>
              </div>
            )}

            {/* Door Reports */}
            {reports.map((r, i) => (
              <DoorReport key={r.id} report={r} index={i} onUpdate={updated => updateReport(r.id, updated)} onRemove={() => removeReport(r.id)} totalReports={reports.length} />
            ))}

            {/* Add Door */}
            <button onClick={addDoor} style={{ width: "100%", padding: "18px", borderRadius: "14px", border: "2px dashed #cbd5e1", background: "white", color: "#64748b", fontSize: "15px", fontWeight: "600", cursor: "pointer", fontFamily: "'Oswald', sans-serif", letterSpacing: "0.06em", display: "flex", alignItems: "center", justifyContent: "center", gap: "10px", marginBottom: "24px" }}>
              <span style={{ fontSize: "20px" }}>+</span> ADD ANOTHER DOOR
            </button>

            {/* Save Button */}
            <button onClick={handleSave} style={{ width: "100%", padding: "16px", borderRadius: "14px", border: "none", background: "linear-gradient(135deg, #0f172a, #1e3a5f)", color: "white", fontSize: "15px", fontWeight: "700", cursor: "pointer", fontFamily: "'Oswald', sans-serif", letterSpacing: "0.08em", marginBottom: "40px", boxShadow: "0 4px 20px rgba(15,23,42,0.25)" }}>
              🖨 SAVE AS PDF
            </button>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
